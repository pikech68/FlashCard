<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f3fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="キャリコン単語帳">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>キャリコン単語帳</title>

<style>
:root{
  --bg:#f6f7fb;
  --surface:#ffffff;
  --surface-soft:#fafbff;
  --text:#1f2430;
  --muted:#7b8290;
  --line:#e4e7ee;
  --accent:#5964d9;
  --accent-deep:#4752c8;
  --accent-soft:#eef0ff;
  --danger:#c95757;
  --danger-soft:#fff4f4;
  --success:#4f9a7b;
  --shadow:0 10px 28px rgba(44,52,78,.07);
  --shadow-soft:0 3px 12px rgba(44,52,78,.055);
}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:
    radial-gradient(circle at top left, rgba(112,121,232,.08), transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
}

.app{
  width:min(100%,880px);
  margin:0 auto;
  padding:12px 10px 36px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:4px 4px 10px;
}

h1{
  margin:0;
  font-size:22px;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:780;
}

.brand-mark{
  display:inline-grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:11px;
  color:#fff;
  background:linear-gradient(145deg,#6873e5,#8a72e1);
  font-size:16px;
  font-weight:800;
  box-shadow:0 6px 16px rgba(92,103,215,.25);
}

.small-note{
  color:var(--muted);
  font-size:12px;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(225,228,238,.8);
  padding:5px 8px;
  border-radius:999px;
}

.panel{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(225,228,238,.92);
  border-radius:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}

.controls{
  padding:10px;
  margin-bottom:12px;
}

.mode-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.list-row{
  display:flex;
  justify-content:flex-end;
  margin-top:7px;
}

.list-button{
  padding:8px 12px;
  font-size:13px;
  box-shadow:none;
  background:#fbfbfd;
}

button{
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  font-weight:600;
  padding:10px 10px;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
  transition:transform .08s ease, box-shadow .12s ease, background .12s ease;
}

button:active{
  transform:scale(.985);
  box-shadow:none;
}

button.primary{
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  color:#fff;
  border-color:transparent;
  font-weight:750;
  box-shadow:0 8px 18px rgba(71,82,200,.22);
}

button.soft{
  background:var(--accent-soft);
  color:var(--accent-deep);
  border-color:#d8dcff;
  box-shadow:none;
}

button.danger{
  color:var(--danger);
  background:var(--danger-soft);
  border-color:#f3d6d6;
  box-shadow:none;
}

#search{
  width:100%;
  margin-top:8px;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface-soft);
  color:var(--text);
  font-size:15px;
  outline:none;
}

#search:focus{
  border-color:#c7ccf9;
  background:#fff;
  box-shadow:0 0 0 3px rgba(89,100,217,.08);
}

.study-card{
  padding:16px 15px 14px;
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
}

#counter{
  color:var(--muted);
  font-size:13px;
  font-weight:650;
}

.status{
  font-size:12px;
  color:var(--danger);
  font-weight:750;
  background:var(--danger-soft);
  padding:4px 7px;
  border-radius:999px;
}

#question{
  white-space:pre-wrap;
  font-size:24px;
  line-height:1.62;
  font-weight:700;
  min-height:185px;
  padding:24px 4px 18px;
  display:flex;
  align-items:flex-start;
  letter-spacing:.005em;
}

.main-actions{
  display:grid;
  grid-template-columns:.9fr 1.35fr .9fr;
  gap:8px;
  margin-top:3px;
}

.main-actions button{
  padding:11px 7px;
  font-size:14px;
}

.secondary-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:9px;
}

.secondary-actions button{
  min-width:82px;
  padding:8px 10px;
  font-size:13px;
  box-shadow:none;
  background:#fbfbfd;
}

.reorder-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--line);
}

.reorder-label{
  width:100%;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-weight:650;
}

.reorder-actions button{
  padding:7px 10px;
  font-size:12px;
  color:#59606d;
  background:#fff;
  box-shadow:none;
}

#answer{
  white-space:pre-wrap;
  font-size:21px;
  line-height:1.68;
  margin-top:16px;
  padding:17px 15px;
  border-radius:15px;
  background:linear-gradient(180deg,#fafbff,#f7f8fd);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}

.image-section{
  margin-top:12px;
  padding:13px;
  border-radius:15px;
  background:#fffaf4;
  border:1px solid #f0dfca;
}

.image-label{
  font-size:13px;
  font-weight:750;
  color:#89653a;
  margin-bottom:7px;
}

#cardImage{
  width:100%;
  max-height:470px;
  object-fit:contain;
  margin:0;
  border-radius:12px;
  background:#fff;
  border:1px solid #eee5d9;
}

.list-panel{
  margin-top:14px;
  padding:14px;
}

.list-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.list-title{
  font-size:18px;
  font-weight:780;
}

.list-count{
  display:inline-block;
  margin-top:4px;
}

.question-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.question-list-item{
  width:100%;
  text-align:left;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:start;
  gap:10px;
  padding:11px 12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:none;
}

.question-list-item .num{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
  min-width:26px;
}

.question-list-item .qtext{
  font-size:14px;
  line-height:1.45;
  font-weight:650;
  overflow-wrap:anywhere;
}

.question-list-item .flag{
  color:var(--danger);
  font-size:12px;
  font-weight:800;
}

.add-wrap{
  margin-top:14px;
  overflow:hidden;
}

summary{
  list-style:none;
  cursor:pointer;
  padding:15px 16px;
  font-weight:760;
  font-size:16px;
}

summary::-webkit-details-marker{display:none}

summary::after{
  content:"＋";
  float:right;
  color:var(--accent);
  font-size:20px;
  line-height:1;
  font-weight:500;
}

details[open] summary::after{content:"－"}

.form-body{
  border-top:1px solid var(--line);
  padding:14px 14px 16px;
}

textarea,
input[type="text"]{
  width:100%;
  margin:7px 0;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  font-size:16px;
  line-height:1.55;
  background:#fff;
  color:var(--text);
  outline:none;
}

textarea:focus,
input[type="text"]:focus{
  border-color:#c7ccf9;
  box-shadow:0 0 0 3px rgba(89,100,217,.08);
}

textarea{
  min-height:116px;
  resize:vertical;
}

.answer-input{
  min-height:150px;
}

.photo-box{
  border:1px dashed #c9ceda;
  border-radius:13px;
  padding:12px;
  margin:10px 0;
  background:#fbfcff;
}

#preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin:10px 0;
  border-radius:10px;
}

.form-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}

#message{
  min-height:22px;
  margin-top:9px;
  font-size:13px;
  color:#39795f;
}

.hidden{display:none!important}

@media(max-width:520px){
  .app{padding:7px 7px 26px}
  .topbar{padding:5px 3px 9px}
  h1{font-size:20px}
  .brand-mark{width:32px;height:32px}
  .small-note{font-size:11px}
  .controls{padding:9px}
  .study-card{padding:14px 12px 13px}
  #question{
    font-size:22px;
    line-height:1.6;
    min-height:205px;
    padding:26px 3px 20px;
  }
  #answer{font-size:20px}
  button{font-size:13px;padding:9px 8px}
  .main-actions button{font-size:13px;padding:10px 5px}
  .secondary-actions button{min-width:76px}
}
</style>
</head>

<body>
<main class="app">

  <div class="topbar">
    <h1><span class="brand-mark">C</span>キャリコン単語帳</h1>
    <span class="small-note">自分専用</span>
  </div>

  <section class="panel controls">
    <div class="mode-row">
      <button id="allModeButton" class="soft" onclick="setMode('all')">通常</button>
      <button id="wrongModeButton" onclick="setMode('wrong')">✕だけ復習</button>
      <button onclick="shuffleCards()">ランダム</button>
    </div>
    <div class="list-row">
      <button class="list-button" onclick="openQuestionList()">問題一覧</button>
    </div>
    <input id="search" type="text" placeholder="問題・答え・解説を検索" oninput="resetAndDraw()">
  </section>

  <section class="panel study-card">
    <div class="card-head">
      <div id="counter"></div>
      <div id="status" class="status"></div>
    </div>

    <div id="question"></div>

    <div class="main-actions">
      <button onclick="previousQuestion()">← 前へ</button>
      <button class="primary" onclick="showAnswer()">答えを見る</button>
      <button onclick="nextQuestion()">次へ →</button>
    </div>

    <div class="secondary-actions">
      <button id="wrongButton" class="soft" onclick="toggleWrong()">間違えた</button>
      <button onclick="startEdit()">編集</button>
      <button class="danger" onclick="deleteCurrent()">削除</button>
    </div>

    <div class="reorder-actions">
      <span class="reorder-label">順番を変更</span>
      <button onclick="moveCurrent(-1)">↑ 前に移動</button>
      <button onclick="moveCurrent(1)">↓ 後ろに移動</button>
    </div>

    <div id="answer" class="hidden"></div>
    <div id="imageSection" class="hidden image-section">
      <div class="image-label">参考画像</div>
      <img id="cardImage" alt="解説の参考画像">
    </div>
  </section>

  <section id="listPanel" class="panel list-panel hidden">
    <div class="list-panel-head">
      <div>
        <div class="list-title">問題一覧</div>
        <div id="listCount" class="small-note list-count"></div>
      </div>
      <button onclick="closeQuestionList()">閉じる</button>
    </div>
    <div id="questionList" class="question-list"></div>
  </section>

  <details id="editorPanel" class="panel add-wrap">
    <summary id="formTitle">問題を追加</summary>

    <div class="form-body">
      <textarea id="newQuestion" placeholder="問題を入力"></textarea>
      <textarea id="newAnswer" class="answer-input" placeholder="正解（複数行で入力できます）"></textarea>
      <textarea id="newExplanation" placeholder="解説"></textarea>

      <div class="photo-box" id="photoBox" tabindex="0">
        <strong>写真（任意）</strong>
        <div class="small-note">写真を選ぶか、PCではこの枠に画像を貼り付けられます。</div>
        <input id="photoInput" type="file" accept="image/*">
        <img id="preview" alt="写真のプレビュー">
        <div class="form-actions">
          <button type="button" onclick="removePhoto()">写真を外す</button>
        </div>
      </div>

      <div class="form-actions">
        <button id="saveButton" class="primary" onclick="saveCard()">保存</button>
        <button id="cancelButton" class="hidden" onclick="cancelEdit()">編集をやめる</button>
      </div>

      <div id="message"></div>
    </div>
  </details>

</main>

<script>
const KEY = "careerCardsV2";
const STATE_KEY = "careerCardsV2State";
let cards = JSON.parse(localStorage.getItem(KEY) || "[]");

if (cards.length === 0) {
  cards = [{
    id: Date.now(),
    question: "スーパーの理論について正しいものはどれか。\\n\\n① 職業興味を6類型に分類した\\n② 自己概念の発達を重視した\\n③ 計画的偶発性を提唱した\\n④ 欲求階層説を提唱した",
    answer: "②",
    explanation: "スーパーは、自己概念の発達を重視したキャリア発達理論を提唱した。",
    wrong: false,
    image: ""
  }];
  saveAll();
}

cards = cards.map(c => ({
  id: c.id || Date.now() + Math.random(),
  question: c.question || "",
  answer: c.answer || "",
  explanation: c.explanation || "",
  wrong: Boolean(c.wrong),
  image: c.image || ""
}));

let current = 0;
let mode = "all";
let shuffled = false;
let order = [];
let editingId = null;
let pendingImage = "";
let restored = false;
let savedState = {};
try {
  savedState = JSON.parse(localStorage.getItem(STATE_KEY) || "{}");
} catch (e) {
  savedState = {};
}
if (savedState.mode === "wrong" || savedState.mode === "all") {
  mode = savedState.mode;
}

const $ = id => document.getElementById(id);

function saveState(cardId = null) {
  const list = filtered();
  const id = cardId ?? (list[current] ? list[current].id : null);
  localStorage.setItem(STATE_KEY, JSON.stringify({ cardId: id, mode, updatedAt: Date.now() }));
}

function restorePosition() {
  if (restored) return;
  restored = true;
  const list = filtered();
  if (!list.length) {
    if (mode === "wrong") {
      mode = "all";
      restored = false;
      restorePosition();
    }
    return;
  }
  if (savedState.cardId != null) {
    const idx = list.findIndex(c => c.id === savedState.cardId);
    if (idx >= 0) current = idx;
  }
}

function saveAll() {
  localStorage.setItem(KEY, JSON.stringify(cards));
}

function filtered() {
  const keyword = $("search").value.trim().toLowerCase();

  let result = cards.filter(card => {
    const modeOK = mode === "all" || card.wrong;
    const text = `${card.question} ${card.answer} ${card.explanation}`.toLowerCase();
    return modeOK && (keyword === "" || text.includes(keyword));
  });

  if (shuffled) {
    result = order.map(id => result.find(card => card.id === id)).filter(Boolean);
  }
  return result;
}

function draw() {
  restorePosition();
  const list = filtered();
  $("answer").classList.add("hidden");
  $("answer").textContent = "";
  $("imageSection").classList.add("hidden");

  $("allModeButton").className = mode === "all" ? "soft" : "";
  $("wrongModeButton").className = mode === "wrong" ? "soft" : "";

  if (!list.length) {
    $("counter").textContent = "0問";
    $("status").textContent = "";
    $("question").textContent = "該当する問題がありません。";
    $("imageSection").classList.add("hidden");
    return;
  }

  if (current >= list.length) current = 0;
  const card = list[current];

  $("counter").textContent = `${current + 1} / ${list.length}問`;
  $("status").textContent = card.wrong ? "✕ 復習対象" : "";
  $("wrongButton").textContent = card.wrong ? "✕を解除" : "間違えた";
  $("question").textContent = card.question;

  if (card.image) {
    $("cardImage").src = card.image;
    $("cardImage").style.display = "block";
  } else {
    $("cardImage").removeAttribute("src");
    $("imageSection").classList.add("hidden");
  }
}

function showAnswer() {
  const list = filtered();
  if (!list.length) return;
  const card = list[current];
  $("answer").textContent = `【正解】\n${card.answer}\n\n【解説】\n${card.explanation || "解説なし"}`;
  $("answer").classList.remove("hidden");
  if (card.image) {
    $("cardImage").src = card.image;
    $("imageSection").classList.remove("hidden");
  } else {
    $("imageSection").classList.add("hidden");
  }
}

function previousQuestion() {
  const list = filtered();
  if (!list.length) return;
  current = (current - 1 + list.length) % list.length;
  restored = true;
  draw();
}

function nextQuestion() {
  const list = filtered();
  if (!list.length) return;
  current = (current + 1) % list.length;
  restored = true;
  draw();
}

function toggleWrong() {
  const list = filtered();
  if (!list.length) return;

  const original = cards.find(c => c.id === list[current].id);
  if (!original) return;

  original.wrong = !original.wrong;
  saveAll();
  $("message").textContent = original.wrong
    ? "「間違えた問題」に登録しました。"
    : "「間違えた問題」から外しました。";

  if (mode === "wrong" && !original.wrong) current = 0;
  draw();
}


function moveCurrent(direction) {
  if (mode !== "all" || shuffled || $("search").value.trim() !== "") {
    $("message").textContent = "順番の変更は「通常」モードで、検索やランダムを解除してから行ってください。";
    return;
  }

  if (!cards.length) return;

  const card = cards[current];
  const originalIndex = cards.findIndex(c => c.id === card.id);
  if (originalIndex < 0) return;

  const targetIndex = originalIndex + direction;

  if (targetIndex < 0) {
    $("message").textContent = "この問題はすでに先頭です。";
    return;
  }

  if (targetIndex >= cards.length) {
    $("message").textContent = "この問題はすでに最後です。";
    return;
  }

  [cards[originalIndex], cards[targetIndex]] = [cards[targetIndex], cards[originalIndex]];
  saveAll();

  current = targetIndex;
  restored = true;
  saveState(cards[current].id);

  $("message").textContent = direction < 0
    ? "問題を1つ前に移動しました。"
    : "問題を1つ後ろに移動しました。";

  draw();
}

function setMode(newMode) {
  mode = newMode;
  current = 0;
  shuffled = false;
  order = [];
  restored = true;
  saveState(null);
  draw();
}

function shuffleCards() {
  const list = filtered();
  order = list.map(c => c.id);

  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  shuffled = true;
  current = 0;
  restored = true;
  draw();
}

function resetAndDraw() {
  current = 0;
  shuffled = false;
  order = [];
  restored = true;
  draw();
}


function openQuestionList() {
  const list = cards;
  const panel = $("listPanel");
  const container = $("questionList");

  container.innerHTML = "";
  $("listCount").textContent = `${list.length}問`;

  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "small-note";
    empty.textContent = "問題がまだありません。";
    container.appendChild(empty);
  } else {
    list.forEach((card, index) => {
      const btn = document.createElement("button");
      btn.className = "question-list-item";

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = `${index + 1}`;

      const q = document.createElement("span");
      q.className = "qtext";
      q.textContent = card.question.replace(/\s+/g, " ").trim();

      const flag = document.createElement("span");
      flag.className = "flag";
      flag.textContent = card.wrong ? "✕" : "";

      btn.appendChild(num);
      btn.appendChild(q);
      btn.appendChild(flag);

      btn.addEventListener("click", () => jumpToCard(card.id));
      container.appendChild(btn);
    });
  }

  panel.classList.remove("hidden");
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeQuestionList() {
  $("listPanel").classList.add("hidden");
}

function jumpToCard(cardId) {
  mode = "all";
  shuffled = false;
  order = [];
  $("search").value = "";

  const idx = cards.findIndex(card => card.id === cardId);
  if (idx >= 0) {
    current = idx;
    restored = true;
    saveState(cardId);
    draw();
  }

  closeQuestionList();
  document.querySelector(".study-card").scrollIntoView({ behavior: "smooth", block: "start" });
}

function startEdit() {
  const list = filtered();
  if (!list.length) return;
  const card = list[current];

  editingId = card.id;
  $("formTitle").textContent = "問題を編集";
  $("saveButton").textContent = "変更を保存";
  $("cancelButton").classList.remove("hidden");
  $("newQuestion").value = card.question;
  $("newAnswer").value = card.answer;
  $("newExplanation").value = card.explanation;
  pendingImage = card.image || "";
  updatePreview();

  $("editorPanel").open = true;
  $("editorPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => $("newQuestion").focus(), 300);
}

function cancelEdit() {
  editingId = null;
  $("formTitle").textContent = "問題を追加";
  $("saveButton").textContent = "保存";
  $("cancelButton").classList.add("hidden");
  clearForm();
  $("message").textContent = "編集を取り消しました。";
}

function clearForm() {
  $("newQuestion").value = "";
  $("newAnswer").value = "";
  $("newExplanation").value = "";
  $("photoInput").value = "";
  pendingImage = "";
  updatePreview();
}

function saveCard() {
  const question = $("newQuestion").value.trim();
  const answer = $("newAnswer").value.trim();
  const explanation = $("newExplanation").value.trim();

  if (!question || !answer) {
    $("message").textContent = "問題と正解を入力してください。";
    return;
  }

  try {
    if (editingId !== null) {
      const card = cards.find(c => c.id === editingId);
      if (!card) throw new Error();

      card.question = question;
      card.answer = answer;
      card.explanation = explanation;
      card.image = pendingImage;
      saveAll();

      editingId = null;
      $("formTitle").textContent = "問題を追加";
      $("saveButton").textContent = "保存";
      $("cancelButton").classList.add("hidden");
      $("message").textContent = "変更を保存しました。";
    } else {
      cards.push({
        id: Date.now(),
        question,
        answer,
        explanation,
        wrong: false,
        image: pendingImage
      });

      saveAll();
      mode = "all";
      shuffled = false;
      order = [];
      current = cards.length - 1;
      $("message").textContent = "保存しました。";
    }

    clearForm();
    draw();
  } catch (error) {
    $("message").textContent =
      "保存できませんでした。写真が大きすぎる可能性があります。";
  }
}

function deleteCurrent() {
  const list = filtered();
  if (!list.length) return;
  const card = list[current];

  const preview = card.question.replace(/\s+/g, " ").slice(0, 35);
  const ok = confirm(`この問題を削除しますか？\n\n${preview}${card.question.length > 35 ? "…" : ""}`);
  if (!ok) return;

  cards = cards.filter(c => c.id !== card.id);
  saveAll();

  if (editingId === card.id) cancelEdit();
  current = Math.max(0, current - 1);
  $("message").textContent = "問題を削除しました。";
  restored = true;
  draw();
}

function updatePreview() {
  if (pendingImage) {
    $("preview").src = pendingImage;
    $("preview").style.display = "block";
  } else {
    $("preview").removeAttribute("src");
    $("preview").style.display = "none";
  }
}

function removePhoto() {
  pendingImage = "";
  $("photoInput").value = "";
  updatePreview();
  $("message").textContent = "写真を外しました。保存すると反映されます。";
}

async function processImage(file) {
  if (!file || !file.type.startsWith("image/")) return;

  const dataUrl = await fileToDataURL(file);
  const img = await loadImage(dataUrl);

  const maxSide = 1000;
  let width = img.width;
  let height = img.height;

  if (Math.max(width, height) > maxSide) {
    const scale = maxSide / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, width, height);

  pendingImage = canvas.toDataURL("image/jpeg", 0.75);
  updatePreview();
  $("message").textContent = "写真を取り込みました。最後に保存を押してください。";
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

$("photoInput").addEventListener("change", async event => {
  const file = event.target.files && event.target.files[0];
  if (file) await processImage(file);
});

$("photoBox").addEventListener("paste", async event => {
  const items = [...(event.clipboardData?.items || [])];
  const imageItem = items.find(item => item.type.startsWith("image/"));
  if (!imageItem) return;

  event.preventDefault();
  const file = imageItem.getAsFile();
  if (file) await processImage(file);
});

draw();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(error => {
      console.log("Service Worker registration failed:", error);
    });
  });
}
</script>
