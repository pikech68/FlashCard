<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f3fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="キャリコン単語帳">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>キャリコン単語帳</title>
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="logo">C</div>
      <h1>キャリコン単語帳</h1>
      <p>PCとスマホで、同じ問題を同期します。</p>
      <button id="loginButton" class="primary wide">Googleでログイン</button>
      <div id="loginMessage" class="message"></div>
    </div>
  </section>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">C</span><span>キャリコン単語帳</span></div>
      <div class="account">
        <span id="syncStatus" class="sync-status">接続中…</span>
        <button id="logoutButton" class="icon-button" title="ログアウト">退出</button>
      </div>
    </header>

    <section id="migrationBanner" class="migration-banner hidden">
      <div>
        <strong>この端末に旧版の問題があります</strong>
        <p>クラウドへ移すと、PCとスマホで共有できます。</p>
      </div>
      <button id="migrateButton" class="primary">旧データを移す</button>
    </section>

    <section class="panel controls">
      <div class="mode-row">
        <button data-mode="unlearned" class="mode-button active">未習得</button>
        <button data-mode="all" class="mode-button">すべて</button>
        <button data-mode="learned" class="mode-button">覚えた</button>
      </div>
      <div class="filter-row">
        <select id="groupFilter"><option value="">すべてのグループ</option></select>
        <button id="shuffleButton">ランダム</button>
        <button id="listButton">問題一覧</button>
      </div>
      <input id="search" type="search" placeholder="問題・答え・解説を検索">
      <div class="progress-wrap">
        <div class="progress-label"><span id="progressText">0 / 0問 習得</span><span id="currentModeLabel"></span></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
    </section>

    <section class="panel study-card">
      <div class="card-head"><span id="counter">0問</span><span id="groupBadge" class="badge hidden"></span></div>
      <div id="emptyState" class="empty hidden">該当する問題がありません。</div>
      <div id="question"></div>
      <div class="main-actions">
        <button id="prevButton">← 前へ</button>
        <button id="answerButton" class="primary">答えを見る</button>
        <button id="nextButton">次へ →</button>
      </div>
      <div class="secondary-actions">
        <button id="learnedButton" class="success">覚えた</button>
        <button id="editButton">編集</button>
        <button id="deleteButton" class="danger">削除</button>
      </div>
      <div id="answer" class="answer hidden"></div>
      <div id="imageSection" class="image-section hidden"><div class="image-label">参考画像</div><img id="cardImage" alt="参考画像"></div>
    </section>

    <details id="editorPanel" class="panel editor-panel">
      <summary id="editorTitle">問題を追加</summary>
      <div class="form-body">
        <label>問題<textarea id="questionInput" placeholder="問題を入力"></textarea></label>
        <label>正解<textarea id="answerInput" placeholder="正解（複数行可）"></textarea></label>
        <label>解説<textarea id="explanationInput" placeholder="解説"></textarea></label>
        <label>グループ<input id="groupInput" list="groupSuggestions" placeholder="例：スーパー、ホランド、労働法"></label>
        <datalist id="groupSuggestions"></datalist>
        <label>並び順<input id="orderInput" type="number" min="1" step="1" placeholder="空欄なら最後"></label>
        <div class="photo-box">
          <strong>参考画像（任意）</strong>
          <input id="photoInput" type="file" accept="image/*">
          <img id="preview" class="hidden" alt="プレビュー">
          <button id="removePhotoButton" type="button">画像を外す</button>
        </div>
        <div class="form-actions"><button id="saveButton" class="primary">保存</button><button id="cancelEditButton" class="hidden">編集をやめる</button></div>
        <div id="formMessage" class="message"></div>
      </div>
    </details>

    <section id="listPanel" class="panel list-panel hidden">
      <div class="list-head"><div><h2>問題一覧</h2><span id="listCount"></span></div><button id="closeListButton">閉じる</button></div>
      <div class="bulk-box">
        <div><button id="selectAllButton">すべて選択</button><button id="clearSelectionButton">選択解除</button></div>
        <div class="bulk-row"><input id="bulkGroupInput" list="groupSuggestions" placeholder="選択した問題のグループ名"><button id="applyGroupButton" class="primary">まとめて変更</button></div>
      </div>
      <div id="questionList"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
